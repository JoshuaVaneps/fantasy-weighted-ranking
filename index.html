<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fantasy Rankings</title>
  </head>
  <body>
    <div id="app">
      <div class="hero">
        <h1 class="sr-only">Fantasy Rankings</h1>
        <img

          src="/src/assets/hero-banner.png"
          alt=""
          width="1649"
          height="644"
        />
      </div>
      <main class="app-layout">
        <section id="control-panel" class="control-panel" aria-labelledby="control-panel-heading">

          <p class="placeholder">Weight sliders and pins will go here.</p>
        </section>
        <section id="board" class="board" aria-labelledby="board-heading">

          <div id="board-content"></div>

      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
